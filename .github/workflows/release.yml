name: Publish knowledge Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed knowledge engine
        run: python -m pip install 'vaws-knowledge @ git+https://github.com/vllm-ascend-workspace/vaws-knowledge@cf5824dff7bc21b783ce6e12c605d7530b8ef651'
      - name: Build dense OVPack from this commit on CPU
        run: >-
          python -I -m vaws_knowledge distribution build-release
          --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA"
          --out "$RUNNER_TEMP/knowledge-release"
      - name: Publish both verified assets together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -I -m vaws_knowledge distribution publish
          --release "$RUNNER_TEMP/knowledge-release"
          --repository "$GITHUB_REPOSITORY"
